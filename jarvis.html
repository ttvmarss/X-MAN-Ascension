<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="JARVIS" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#000000" />
<title>JARVIS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%2300eaff'/%3E%3Ccircle cx='32' cy='32' r='16' fill='%23000'/%3E%3Ccircle cx='32' cy='32' r='8' fill='%2300eaff'/%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23000'/%3E%3Ccircle cx='90' cy='90' r='70' fill='none' stroke='%2300eaff' stroke-width='6'/%3E%3Ccircle cx='90' cy='90' r='40' fill='%2300eaff'/%3E%3Ccircle cx='90' cy='90' r='22' fill='%23000'/%3E%3C/svg%3E" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%; width: 100%;
  background: #000;
  color: #cfe8ff;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
body {
  position: fixed; inset: 0;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

/* ── ORB CANVAS (full screen background) ── */
#orb-canvas {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  display: block;
  cursor: pointer;
}

/* ── TOP CONTROLS ── */
.top-controls {
  position: fixed;
  top: max(18px, env(safe-area-inset-top));
  right: 18px;
  display: flex; gap: 10px;
  z-index: 10;
}
.ctrl-btn {
  width: 42px; height: 42px;
  border-radius: 50%;
  background: rgba(10, 20, 36, 0.6);
  border: 1px solid rgba(0, 234, 255, 0.25);
  color: #00eaff;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  font-size: 18px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: background 0.15s, border-color 0.15s, transform 0.08s;
}
.ctrl-btn:hover { background: rgba(0, 234, 255, 0.12); border-color: rgba(0, 234, 255, 0.5); }
.ctrl-btn:active { transform: scale(0.92); }
.ctrl-btn.muted {
  color: #ff6a6a; border-color: rgba(255, 100, 100, 0.4);
  background: rgba(40, 10, 10, 0.6);
}

/* ── DROPDOWN MENU ── */
.menu {
  position: fixed;
  top: calc(max(18px, env(safe-area-inset-top)) + 52px);
  right: 18px;
  background: rgba(10, 20, 36, 0.92);
  border: 1px solid rgba(0, 234, 255, 0.25);
  border-radius: 12px;
  min-width: 200px;
  padding: 6px;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  z-index: 10;
  display: none;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
}
.menu.show { display: block; }
.menu-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  color: #cfe8ff;
  font-size: 14px;
  cursor: pointer;
  border-radius: 8px;
  transition: background 0.1s;
}
.menu-item:hover { background: rgba(0, 234, 255, 0.1); color: #fff; }
.menu-item .ico { font-size: 16px; opacity: 0.85; width: 18px; text-align: center; }

/* ── BOTTOM TEXT AREA (status + heard + brand) ── */
.bottom {
  position: fixed;
  bottom: max(20px, env(safe-area-inset-bottom));
  left: 0; right: 0;
  display: flex; flex-direction: column;
  align-items: center;
  gap: 6px;
  pointer-events: none;
  z-index: 5;
  padding: 0 20px;
}
.brand {
  font-weight: 200;
  letter-spacing: 14px;
  font-size: 22px;
  color: #00eaff;
  text-shadow: 0 0 20px rgba(0, 234, 255, 0.6);
  padding-left: 14px; /* compensate for letter-spacing on right */
  font-variant-numeric: tabular-nums;
}
.status {
  font-size: 11px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: rgba(0, 234, 255, 0.7);
  min-height: 14px;
  text-align: center;
}
.heard {
  font-size: 14px;
  color: rgba(255, 255, 255, 0.75);
  min-height: 18px;
  text-align: center;
  max-width: 90%;
  font-style: italic;
  margin-top: 4px;
}
.error {
  font-size: 12px;
  color: #ff8a6a;
  min-height: 14px;
  text-align: center;
  opacity: 0;
  transition: opacity 0.3s;
  max-width: 90%;
}
.error.show { opacity: 1; }

/* ── TEXT INPUT (hidden by default, shown via menu) ── */
.text-bar {
  position: fixed;
  bottom: calc(max(20px, env(safe-area-inset-bottom)) + 100px);
  left: 50%;
  transform: translateX(-50%);
  width: min(560px, calc(100% - 40px));
  display: none;
  z-index: 6;
}
.text-bar.show { display: block; }
.text-in {
  width: 100%;
  height: 48px;
  background: rgba(10, 20, 36, 0.85);
  border: 1px solid rgba(0, 234, 255, 0.3);
  border-radius: 24px;
  padding: 0 20px;
  color: #fff;
  font-size: 15px;
  outline: none;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: border-color 0.15s;
}
.text-in:focus { border-color: rgba(0, 234, 255, 0.7); }
.text-in::placeholder { color: rgba(207, 232, 255, 0.4); }

/* ── CHAT LOG (compact, top-left) ── */
.log {
  position: fixed;
  top: max(80px, calc(env(safe-area-inset-top) + 80px));
  left: 18px;
  width: min(360px, calc(100% - 36px));
  max-height: 50vh;
  overflow-y: auto;
  display: none;
  z-index: 4;
  -webkit-overflow-scrolling: touch;
  padding-right: 4px;
}
.log.show { display: block; }
.log::-webkit-scrollbar { width: 3px; }
.log::-webkit-scrollbar-thumb { background: rgba(0, 234, 255, 0.2); border-radius: 3px; }
.msg {
  margin: 6px 0;
  padding: 8px 12px;
  border-radius: 12px;
  font-size: 13px;
  line-height: 1.4;
  max-width: 95%;
  word-wrap: break-word;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity:0; transform: translateY(-3px); } to { opacity:1; transform: none; } }
.msg.user {
  background: rgba(0, 234, 255, 0.1);
  border: 1px solid rgba(0, 234, 255, 0.25);
  color: #e3f7ff;
}
.msg.jarvis {
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: #cfe8ff;
}
.msg.system {
  background: transparent;
  color: #5a7a98;
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
  border: none;
  text-align: center;
  padding: 4px;
}

/* ── SETTINGS MODAL ── */
.modal {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: none;
  align-items: center; justify-content: center;
  z-index: 100;
  padding: 18px;
}
.modal.show { display: flex; }
.panel {
  width: 100%;
  max-width: 480px;
  background: rgba(10, 20, 36, 0.98);
  border: 1px solid rgba(0, 234, 255, 0.3);
  border-radius: 20px;
  padding: 24px;
  box-shadow: 0 0 80px rgba(0, 234, 255, 0.15);
  max-height: 92vh;
  overflow-y: auto;
}
.panel h2 {
  color: #00eaff;
  letter-spacing: 3px;
  font-size: 16px;
  font-weight: 300;
  margin-bottom: 4px;
}
.panel .subtitle { color: #5a7a98; font-size: 11px; margin-bottom: 14px; }
.panel label {
  display: block;
  color: #cfe8ff;
  font-size: 12px;
  margin: 14px 0 5px;
  opacity: 0.85;
  letter-spacing: 0.5px;
}
.panel input, .panel select {
  width: 100%;
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(0, 234, 255, 0.2);
  color: #fff;
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 14px;
  outline: none;
  -webkit-appearance: none;
  transition: border-color 0.15s;
}
.panel input:focus, .panel select:focus { border-color: rgba(0, 234, 255, 0.7); }
.panel select option { background: #0a1424; }
.panel small { color: #4a6a88; display: block; font-size: 11px; margin-top: 5px; line-height: 1.5; }
.panel .row { display: flex; gap: 8px; margin-top: 18px; }
.panel button {
  flex: 1;
  background: #00eaff;
  color: #001820;
  border: none;
  padding: 12px;
  border-radius: 10px;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  letter-spacing: 1px;
  transition: transform 0.08s;
}
.panel button.ghost {
  background: transparent;
  color: #cfe8ff;
  border: 1px solid rgba(255, 255, 255, 0.18);
}
.panel button:active { transform: translateY(1px); }
.divider { border: none; border-top: 1px solid rgba(0, 234, 255, 0.1); margin: 16px 0; }
</style>
</head>
<body>

<canvas id="orb-canvas"></canvas>

<!-- ── TOP RIGHT CONTROLS ── -->
<div class="top-controls">
  <button id="micBtn" class="ctrl-btn muted" aria-label="Toggle microphone" title="Toggle mic (Space)">&#127908;</button>
  <button id="menuBtn" class="ctrl-btn" aria-label="Menu" title="Menu">&#8942;</button>
</div>

<!-- ── DROPDOWN MENU ── -->
<div id="menu" class="menu">
  <div class="menu-item" data-action="text"><span class="ico">&#9000;</span> Text Input</div>
  <div class="menu-item" data-action="log"><span class="ico">&#128172;</span> Conversation</div>
  <div class="menu-item" data-action="clear"><span class="ico">&#128465;</span> Clear History</div>
  <div class="menu-item" data-action="stop"><span class="ico">&#128263;</span> Stop Speaking</div>
  <div class="menu-item" data-action="settings"><span class="ico">&#9881;</span> Settings</div>
</div>

<!-- ── CHAT LOG ── -->
<div id="log" class="log"></div>

<!-- ── TEXT INPUT BAR ── -->
<div id="textBar" class="text-bar">
  <input id="textIn" class="text-in" placeholder="Type a command…" enterkeyhint="send" autocomplete="off" />
</div>

<!-- ── BOTTOM STATUS ── -->
<div class="bottom">
  <div id="error" class="error"></div>
  <div id="heard" class="heard"></div>
  <div id="status" class="status">Initialising</div>
  <div class="brand">JARVIS</div>
</div>

<!-- ── SETTINGS MODAL ── -->
<div id="modal" class="modal" role="dialog" aria-modal="true">
  <div class="panel">
    <h2>SETTINGS</h2>
    <p class="subtitle">Local-only — your data never leaves this device.</p>

    <label>AI Provider</label>
    <select id="provider">
      <option value="none">Built-in commands only (no API)</option>
      <option value="openrouter">OpenRouter — Free AI models</option>
      <option value="claude">Anthropic Claude</option>
    </select>
    <small id="providerHint"></small>

    <div id="keyRow">
      <label id="keyLabel">API Key</label>
      <input id="apiKey" type="password" placeholder="Paste your key…" autocomplete="off" />
      <small id="keyHint"></small>
    </div>

    <div id="modelRow">
      <label>Model</label>
      <select id="model"></select>
    </div>

    <hr class="divider" />

    <label>Wake Word <small style="display:inline;color:#4a6a88">(say this before your command)</small></label>
    <input id="wake" type="text" placeholder="jarvis" autocomplete="off" />
    <small>Leave blank to respond to all speech.</small>

    <label>Your Name</label>
    <input id="userName" type="text" placeholder="e.g. Tony" autocomplete="off" />

    <label>Voice</label>
    <select id="voice"></select>

    <label>Speech Rate</label>
    <select id="rateSelect">
      <option value="0.88">Slow</option>
      <option value="0.95" selected>Normal</option>
      <option value="1.05">Slightly fast</option>
      <option value="1.15">Fast</option>
    </select>

    <div class="row">
      <button class="ghost" id="cancelBtn">Cancel</button>
      <button id="saveBtn">Save</button>
    </div>
  </div>
</div>

<!-- ── Three.js from CDN ── -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
(() => {
'use strict';

/* ════════════════════════════════════════════════════
   STORE
════════════════════════════════════════════════════ */
const S = {
  g: k => localStorage.getItem('jarvis_' + k),
  s: (k, v) => localStorage.setItem('jarvis_' + k, v),
  get provider() { return this.g('provider') || 'none'; },
  set provider(v){ this.s('provider', v); },
  get key()      { return this.g('key') || ''; },
  set key(v)     { this.s('key', v); },
  get model()    { return this.g('model') || ''; },
  set model(v)   { this.s('model', v); },
  get wake()     { return this.g('wake') ?? 'jarvis'; },
  set wake(v)    { this.s('wake', v); },
  get voice()    { return this.g('voice') || ''; },
  set voice(v)   { this.s('voice', v); },
  get rate()     { return parseFloat(this.g('rate') || '0.95'); },
  set rate(v)    { this.s('rate', v); },
  get name()     { return this.g('name') || ''; },
  set name(v)    { this.s('name', v); },
};

const MODELS = {
  openrouter: [
    { id: 'meta-llama/llama-3.3-70b-instruct:free', label: 'Llama 3.3 70B — Free, smart' },
    { id: 'meta-llama/llama-3.1-8b-instruct:free',  label: 'Llama 3.1 8B — Free, fast' },
    { id: 'google/gemma-3-12b-it:free',              label: 'Gemma 3 12B — Free' },
    { id: 'mistralai/mistral-7b-instruct:free',     label: 'Mistral 7B — Free' },
    { id: 'deepseek/deepseek-r1-0528:free',          label: 'DeepSeek R1 — Free' },
  ],
  claude: [
    { id: 'claude-haiku-4-5-20251001', label: 'Haiku 4.5 — fastest' },
    { id: 'claude-sonnet-4-6',         label: 'Sonnet 4.6 — balanced' },
    { id: 'claude-opus-4-7',           label: 'Opus 4.7 — smartest' },
  ],
};

const PROVIDER_HINTS = {
  none: 'Built-in commands only — works offline, no API key.',
  openrouter: 'Free key at openrouter.ai — no credit card required.',
  claude: 'Paid API key at console.anthropic.com.',
};

/* ════════════════════════════════════════════════════
   DOM
════════════════════════════════════════════════════ */
const canvas      = document.getElementById('orb-canvas');
const statusEl    = document.getElementById('status');
const heardEl     = document.getElementById('heard');
const errorEl     = document.getElementById('error');
const logEl       = document.getElementById('log');
const micBtn      = document.getElementById('micBtn');
const menuBtn     = document.getElementById('menuBtn');
const menu        = document.getElementById('menu');
const textBar     = document.getElementById('textBar');
const textIn      = document.getElementById('textIn');
const modal       = document.getElementById('modal');
const providerIn  = document.getElementById('provider');
const providerHint= document.getElementById('providerHint');
const keyRow      = document.getElementById('keyRow');
const keyLabel    = document.getElementById('keyLabel');
const apiKeyIn    = document.getElementById('apiKey');
const keyHint     = document.getElementById('keyHint');
const modelRow    = document.getElementById('modelRow');
const modelIn     = document.getElementById('model');
const wakeIn      = document.getElementById('wake');
const userNameIn  = document.getElementById('userName');
const voiceIn     = document.getElementById('voice');
const rateSelect  = document.getElementById('rateSelect');
const saveBtn     = document.getElementById('saveBtn');
const cancelBtn   = document.getElementById('cancelBtn');

/* ════════════════════════════════════════════════════
   STATE MACHINE — idle | listening | thinking | speaking
════════════════════════════════════════════════════ */
let state = 'idle';
let wantListen = false;
let recognizing = false;
let isSpeaking = false;
let recognition = null;
let recPaused = false;

const chatHistory = [];
const recentReplies = [];

const STATE_COLORS = {
  idle:      { r: 0.00, g: 0.92, b: 1.00 },   // cyan
  listening: { r: 0.20, g: 1.00, b: 1.00 },   // bright cyan
  thinking:  { r: 0.66, g: 0.42, b: 1.00 },   // purple
  speaking:  { r: 1.00, g: 0.78, b: 0.20 },   // amber
};
let currentColor = { ...STATE_COLORS.idle };
let targetColor  = { ...STATE_COLORS.idle };
let stateIntensity = 0.0;    // smooth interpolation factor
let audioLevel    = 0.0;     // mic amplitude (0-1)

function setState(s) {
  if (state === s) return;
  state = s;
  targetColor = STATE_COLORS[s];
  const labels = {
    idle: S.wake ? `Say "${S.wake}" or tap orb` : 'Tap orb or mic',
    listening: 'Listening',
    thinking: 'Thinking',
    speaking: 'Speaking',
  };
  setStatus(labels[s] || '');
}

function setStatus(t) { statusEl.textContent = t; }
function setHeard(t)  { heardEl.textContent = t; }
function showError(t) {
  errorEl.textContent = t;
  errorEl.classList.add('show');
  clearTimeout(showError._t);
  showError._t = setTimeout(() => errorEl.classList.remove('show'), 5000);
}
function logMsg(text, who) {
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.textContent = text;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}

/* ════════════════════════════════════════════════════
   THREE.JS PARTICLE ORB
════════════════════════════════════════════════════ */
let scene, camera, renderer, points, geometry, material;
const PARTICLE_COUNT = 4500;
const basePositions = new Float32Array(PARTICLE_COUNT * 3);
const positions     = new Float32Array(PARTICLE_COUNT * 3);

function initOrb() {
  scene = new THREE.Scene();

  const aspect = window.innerWidth / window.innerHeight;
  camera = new THREE.PerspectiveCamera(50, aspect, 0.1, 100);
  camera.position.z = 3.0;

  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 1);

  // Fibonacci sphere distribution → even particle spread
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const phi   = Math.acos(1 - 2 * (i + 0.5) / PARTICLE_COUNT);
    const theta = Math.PI * (1 + Math.sqrt(5)) * (i + 0.5);
    const x = Math.sin(phi) * Math.cos(theta);
    const y = Math.sin(phi) * Math.sin(theta);
    const z = Math.cos(phi);
    basePositions[i * 3]     = positions[i * 3]     = x;
    basePositions[i * 3 + 1] = positions[i * 3 + 1] = y;
    basePositions[i * 3 + 2] = positions[i * 3 + 2] = z;
  }

  geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

  material = new THREE.PointsMaterial({
    color: new THREE.Color(currentColor.r, currentColor.g, currentColor.b),
    size: 0.022,
    transparent: true,
    opacity: 0.95,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true,
  });

  points = new THREE.Points(geometry, material);
  scene.add(points);

  // Inner glow sphere (subtle)
  const glowGeo = new THREE.SphereGeometry(0.55, 32, 32);
  const glowMat = new THREE.MeshBasicMaterial({
    color: 0x00eaff,
    transparent: true,
    opacity: 0.05,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  glow.userData.isGlow = true;
  scene.add(glow);

  window.addEventListener('resize', onResize);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate(t) {
  requestAnimationFrame(animate);
  const time = t * 0.001;

  // Smoothly interpolate state intensity for transitions
  const targetIntensity = state === 'idle' ? 0.05
                        : state === 'listening' ? 0.18
                        : state === 'thinking' ? 0.28
                        : state === 'speaking' ? 0.22 + audioLevel * 0.3
                        : 0.05;
  stateIntensity += (targetIntensity - stateIntensity) * 0.08;

  // Smoothly interpolate color
  currentColor.r += (targetColor.r - currentColor.r) * 0.06;
  currentColor.g += (targetColor.g - currentColor.g) * 0.06;
  currentColor.b += (targetColor.b - currentColor.b) * 0.06;
  material.color.setRGB(currentColor.r, currentColor.g, currentColor.b);

  // Audio reactivity decay
  audioLevel *= 0.92;

  const speed = state === 'thinking' ? 1.8
              : state === 'speaking' ? 1.3
              : state === 'listening' ? 1.0
              : 0.5;

  // Displace particles using cheap noise (sum of sines)
  const pos = geometry.attributes.position.array;
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const i3 = i * 3;
    const bx = basePositions[i3];
    const by = basePositions[i3 + 1];
    const bz = basePositions[i3 + 2];
    const n  =
      Math.sin(bx * 3.2 + time * speed) * 0.5 +
      Math.cos(by * 3.7 + time * speed * 1.3) * 0.4 +
      Math.sin(bz * 4.1 + time * speed * 0.9 + bx * 2.0) * 0.4;
    const disp = 1.0 + stateIntensity * (0.6 + n * 0.7) + audioLevel * 0.15;
    pos[i3]     = bx * disp;
    pos[i3 + 1] = by * disp;
    pos[i3 + 2] = bz * disp;
  }
  geometry.attributes.position.needsUpdate = true;

  // Rotation feels alive
  points.rotation.y += 0.0025 * (state === 'thinking' ? 2.5 : 1);
  points.rotation.x = Math.sin(time * 0.3) * 0.1;

  // Update glow opacity
  scene.children.forEach(c => {
    if (c.userData?.isGlow) {
      c.material.opacity = 0.04 + stateIntensity * 0.15;
      c.material.color.setRGB(currentColor.r, currentColor.g, currentColor.b);
    }
  });

  renderer.render(scene, camera);
}

/* ════════════════════════════════════════════════════
   AUDIO REACTIVITY (mic amplitude → orb scale)
════════════════════════════════════════════════════ */
let audioCtx = null, analyser = null, micStream = null, audioRAF = null;

async function startAudioAnalyser() {
  try {
    if (!micStream) {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    }
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const src = audioCtx.createMediaStreamSource(micStream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      src.connect(analyser);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const data = new Uint8Array(analyser.frequencyBinCount);
    function tick() {
      analyser.getByteFrequencyData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) sum += data[i];
      const avg = sum / data.length / 255;
      audioLevel = Math.max(audioLevel, avg * 1.5);
      audioRAF = requestAnimationFrame(tick);
    }
    tick();
  } catch (e) {
    // Mic permission denied or unavailable — visual still works without audio
  }
}
function stopAudioAnalyser() {
  if (audioRAF) cancelAnimationFrame(audioRAF);
  audioRAF = null;
  audioLevel = 0;
}

/* ════════════════════════════════════════════════════
   DEDUP — never repeat
════════════════════════════════════════════════════ */
function normalize(s) { return s.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim(); }
function similarity(a, b) {
  a = normalize(a); b = normalize(b);
  if (!a || !b) return 0;
  if (a === b) return 1;
  const longer = a.length > b.length ? a : b;
  const shorter = a.length > b.length ? b : a;
  if (longer.includes(shorter) && shorter.length > 6) return shorter.length / longer.length;
  const bigrams = s => { const bg = new Set(); for (let i=0;i<s.length-1;i++) bg.add(s.slice(i,i+2)); return bg; };
  const ab = bigrams(a), bb = bigrams(b);
  let overlap = 0;
  ab.forEach(g => { if (bb.has(g)) overlap++; });
  return (2 * overlap) / (ab.size + bb.size);
}
function isDuplicate(text) {
  return recentReplies.some(r => similarity(r, text) > 0.72);
}
function trackReply(text) {
  recentReplies.push(text);
  if (recentReplies.length > 5) recentReplies.shift();
}

/* ════════════════════════════════════════════════════
   SPEECH SYNTHESIS — never overlap with mic
════════════════════════════════════════════════════ */
let voices = [];
function loadVoices() {
  voices = window.speechSynthesis.getVoices();
  voiceIn.innerHTML = '<option value="">Auto — best available</option>';
  voices.forEach(v => {
    const o = document.createElement('option');
    o.value = v.name;
    o.textContent = `${v.name} (${v.lang})`;
    voiceIn.appendChild(o);
  });
  voiceIn.value = S.voice;
}
if ('speechSynthesis' in window) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function pickVoice() {
  if (!voices.length) voices = window.speechSynthesis.getVoices();
  const saved = S.voice;
  if (saved) { const v = voices.find(x => x.name === saved); if (v) return v; }
  // Prefer British male / enhanced English (Jarvis-style)
  const prefs = [
    v => /Daniel/i.test(v.name)  && v.lang.startsWith('en'),
    v => /Oliver/i.test(v.name)  && v.lang.startsWith('en'),
    v => /Arthur/i.test(v.name)  && v.lang.startsWith('en'),
    v => /George/i.test(v.name)  && v.lang.startsWith('en'),
    v => /Microsoft (Ryan|George|Thomas)/i.test(v.name),
    v => /en-GB/i.test(v.lang)   && /enhanced|premium|natural/i.test(v.name),
    v => /en-GB/i.test(v.lang),
    v => /en-US/i.test(v.lang)   && /enhanced|premium|natural/i.test(v.name),
    v => /en-US/i.test(v.lang),
    v => v.lang.startsWith('en'),
  ];
  for (const p of prefs) { const v = voices.find(p); if (v) return v; }
  return voices[0];
}

function stopSpeaking() {
  try { window.speechSynthesis.cancel(); } catch {}
  isSpeaking = false;
  if (state === 'speaking') setState(wantListen ? 'listening' : 'idle');
}

function speak(text) {
  return new Promise(resolve => {
    if (!('speechSynthesis' in window)) return resolve();
    // CRITICAL: stop mic before speaking so we don't loop back
    if (recognizing) pauseRec();
    try { window.speechSynthesis.cancel(); } catch {}
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice();
    if (v) u.voice = v;
    u.rate   = S.rate;
    u.pitch  = 0.95;
    u.volume = 1.0;
    u.onstart = () => { isSpeaking = true; setState('speaking'); };
    u.onend = () => {
      isSpeaking = false;
      if (wantListen) { setState('listening'); resumeRec(); }
      else            { setState('idle'); }
      resolve();
    };
    u.onerror = () => {
      isSpeaking = false;
      if (wantListen) resumeRec(); else setState('idle');
      resolve();
    };
    window.speechSynthesis.speak(u);
  });
}

// Keep TTS alive past iOS 15s timeout
setInterval(() => {
  if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
    window.speechSynthesis.pause();
    window.speechSynthesis.resume();
  }
}, 12000);

/* ════════════════════════════════════════════════════
   SPEECH RECOGNITION — paused while speaking
════════════════════════════════════════════════════ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function buildRec() {
  if (!SR) return null;
  const r = new SR();
  r.lang = 'en-US';
  r.interimResults = true;
  r.continuous = false;
  r.maxAlternatives = 1;

  r.onstart = () => {
    recognizing = true;
    recPaused = false;
    if (!isSpeaking) setState('listening');
    micBtn.classList.remove('muted');
    startAudioAnalyser();
  };
  r.onresult = (e) => {
    if (isSpeaking) return;
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      if (res.isFinal) final += res[0].transcript;
      else             interim += res[0].transcript;
    }
    setHeard(final || interim);
    if (final) handleFinal(final.trim());
  };
  r.onerror = (e) => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      wantListen = false;
      micBtn.classList.add('muted');
      setState('idle');
      showError('Microphone permission denied. Allow it in your browser settings.');
    } else if (e.error === 'no-speech') {
      // benign — recognition restarts naturally
    } else if (e.error !== 'aborted') {
      showError('Mic error: ' + e.error);
    }
  };
  r.onend = () => {
    recognizing = false;
    if (recPaused) return;
    if (wantListen && !isSpeaking) {
      try { r.start(); } catch {}
    } else {
      micBtn.classList.add('muted');
      stopAudioAnalyser();
      if (!isSpeaking) setState('idle');
    }
  };
  return r;
}

function startRec() {
  if (!SR) {
    showError('Speech recognition not supported. Use Chrome, Edge, or Safari.');
    return;
  }
  stopSpeaking();
  if (recognition) { try { recognition.abort(); } catch {} }
  recognition = buildRec();
  wantListen = true;
  try { recognition.start(); } catch {}
}

function stopRec() {
  wantListen = false;
  recPaused = false;
  if (recognition) { try { recognition.abort(); } catch {} }
  recognizing = false;
  micBtn.classList.add('muted');
  setHeard('');
  stopAudioAnalyser();
  if (!isSpeaking) setState('idle');
}

function pauseRec() {
  recPaused = true;
  if (recognition) { try { recognition.abort(); } catch {} }
  recognizing = false;
}

function resumeRec() {
  if (!wantListen) return;
  recPaused = false;
  if (recognition) { try { recognition.abort(); } catch {} }
  recognition = buildRec();
  try { recognition.start(); } catch {}
}

function toggleMic() {
  if (wantListen) stopRec(); else startRec();
}

/* ════════════════════════════════════════════════════
   COMMAND HANDLING
════════════════════════════════════════════════════ */
async function handleFinal(text) {
  if (!text) return;
  const wake = (S.wake || '').trim().toLowerCase();
  let cmd = text;
  if (wake) {
    const lower = text.toLowerCase();
    const idx = lower.indexOf(wake);
    if (idx === -1) { setHeard(''); return; }
    cmd = text.slice(idx + wake.length).trim();
    if (!cmd) { await respond("Yes?", false); return; }
  }
  setHeard('');
  logMsg(cmd, 'user');
  chatHistory.push({ role: 'user', content: cmd });
  await processCommand(cmd);
}

async function processCommand(text) {
  const local = await tryLocal(text);
  if (local !== null) { await respond(local); return; }
  if (S.provider !== 'none' && S.key) { await askAI(text); return; }
  await respond(
    S.provider === 'none'
      ? "I'm running on built-in commands. Add a free API key in Settings to expand my capabilities."
      : "I can't reach my AI right now. Check your API key in Settings."
  );
}

async function respond(text, addToHistory = true) {
  if (isDuplicate(text)) text += " — anything else I can help with?";
  trackReply(text);
  if (addToHistory) chatHistory.push({ role: 'assistant', content: text });
  logMsg(text, 'jarvis');
  await speak(text);
}

/* ════════════════════════════════════════════════════
   BUILT-IN COMMANDS
════════════════════════════════════════════════════ */
async function tryLocal(raw) {
  const t = raw.toLowerCase().trim().replace(/[.!?]+$/, '');
  const name = S.name ? `, ${S.name}` : '';

  if (/^(hi|hello|hey|good (morning|afternoon|evening|day))\b/.test(t)) return greeting();
  if (/\b(what.?s? the time|what time is it|tell me the time|current time|time now)\b/.test(t))
    return `It's ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}${name}.`;
  if (/\b(what.?s? (the )?date|what day is (it|today)|today.?s date|current date)\b/.test(t))
    return `Today is ${new Date().toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })}${name}.`;
  if (/^thank( you|s)\b/.test(t)) return `At your service${name}.`;
  if (/\b(how are you|you okay|you alright)\b/.test(t)) return 'All systems fully operational.';
  if (/\b(who are you|what are you|your name|introduce yourself)\b/.test(t))
    return `I'm Jarvis — Just A Rather Very Intelligent System${name}.`;
  if (/\b(stop|shut up|quiet|silence|cancel speaking|be quiet)\b/.test(t)) { stopSpeaking(); return null; }
  if (/\b(clear|reset) (chat|conversation|history|log)\b/.test(t)) {
    chatHistory.length = 0; logEl.innerHTML = ''; recentReplies.length = 0;
    return `Conversation cleared${name}.`;
  }
  if (/^(tell me a |a |give me a )?joke\b/.test(t)) {
    const jokes = [
      "Why do programmers prefer dark mode? Because light attracts bugs.",
      "I told my computer I needed a break. Now it won't stop sending me KitKats.",
      "A SQL query walks into a bar, sees two tables, and asks: can I join you?",
      "Why did the developer go broke? He used up all his cache.",
      "I would tell you a UDP joke, but you might not get it.",
      "There are 10 kinds of people: those who understand binary, and those who don't.",
    ];
    return jokes[Math.floor(Math.random() * jokes.length)];
  }

  // Math
  const mathMatch = t.match(/^(?:what(?:'s| is)|calculate|compute|solve|how much is)\s+(.+)$/);
  if (mathMatch) {
    const expr = mathMatch[1]
      .replace(/\bplus\b/g, '+').replace(/\bminus\b/g, '-')
      .replace(/\btimes\b|\bmultiplied by\b/g, '*')
      .replace(/\bdivided by\b|\bover\b/g, '/')
      .replace(/[^0-9+\-*/().\s]/g, '');
    if (expr && /[0-9]/.test(expr)) {
      try {
        const v = Function('"use strict"; return (' + expr + ');')();
        if (typeof v === 'number' && isFinite(v))
          return `The answer is ${+v.toFixed(8).replace(/\.?0+$/, '')}.`;
      } catch {}
    }
  }

  // Timer
  const timer = t.match(/^(?:set (?:a )?timer for |timer )(\d+)\s*(seconds?|secs?|minutes?|mins?|hours?|hrs?)/);
  if (timer) {
    const n = parseInt(timer[1], 10);
    const unit = timer[2];
    const ms = n * (/^h/.test(unit) ? 3600000 : /^m/.test(unit) ? 60000 : 1000);
    setTimeout(() => respond(`Timer for ${n} ${unit} is up${name}.`, false), ms);
    return `Timer set for ${n} ${unit}.`;
  }

  // Reminder
  const remMatch = t.match(/remind me (to .+?) in (\d+)\s*(seconds?|minutes?|hours?)/);
  if (remMatch) {
    const ms = parseInt(remMatch[2], 10) * (/^h/.test(remMatch[3]) ? 3600000 : /^m/.test(remMatch[3]) ? 60000 : 1000);
    setTimeout(() => respond(`Reminder${name}: ${remMatch[1]}.`, false), ms);
    return `I'll remind you ${remMatch[1]} in ${remMatch[2]} ${remMatch[3]}.`;
  }

  // Battery
  if (/\b(battery|power level|charge level)\b/.test(t)) {
    if (navigator.getBattery) {
      try {
        const b = await navigator.getBattery();
        return `Battery is at ${Math.round(b.level * 100)} percent${b.charging ? ', charging' : ''}.`;
      } catch {}
    }
    return "I can't read the battery on this device.";
  }
  if (/\b(am i online|internet|connection|wifi)\b/.test(t))
    return navigator.onLine ? "You're online." : "You appear to be offline.";

  // Open / search / play
  const openM = t.match(/^(?:open|launch|go to|navigate to)\s+(.+)$/);
  if (openM) { window.open(guessUrl(openM[1].trim()), '_blank'); return `Opening ${openM[1]}.`; }
  const searchM = t.match(/^(?:search(?:\s+for)?|google|look\s+up|find)\s+(.+)$/);
  if (searchM) { window.open('https://www.google.com/search?q=' + encodeURIComponent(searchM[1]), '_blank'); return `Searching for ${searchM[1]}.`; }
  const ytM = t.match(/^(?:play|youtube)\s+(.+)$/);
  if (ytM) { window.open('https://www.youtube.com/results?search_query=' + encodeURIComponent(ytM[1]), '_blank'); return `Looking up ${ytM[1]} on YouTube.`; }

  // Weather
  if (/\b(weather|forecast|temperature)\b/.test(t)) {
    const locM = t.match(/(?:in|for|at)\s+(.+)$/);
    const loc = locM ? locM[1].trim() : '';
    try {
      const r = await fetch(`https://wttr.in/${encodeURIComponent(loc)}?format=3&lang=en`);
      if (r.ok) { const text = await r.text(); return `Weather: ${text.trim()}.`; }
    } catch {}
    window.open(`https://www.google.com/search?q=weather+${encodeURIComponent(loc)}`, '_blank');
    return `Pulling up the weather${loc ? ' for ' + loc : ''}.`;
  }

  if (/\b(open settings|settings)\b/.test(t)) { openSettings(); return 'Settings opened.'; }
  if (/\b(help|what can you do|commands)\b/.test(t))
    return "I handle time, date, math, timers, reminders, weather, web searches, opening sites, and with an API key I can answer anything.";

  return null;
}

function greeting() {
  const h = new Date().getHours();
  const part = h < 5 ? 'night' : h < 12 ? 'morning' : h < 18 ? 'afternoon' : 'evening';
  const name = S.name ? `, ${S.name}` : '';
  return `Good ${part}${name}. How can I assist?`;
}

function guessUrl(target) {
  const map = {
    youtube: 'https://www.youtube.com', google: 'https://www.google.com',
    gmail: 'https://mail.google.com', twitter: 'https://twitter.com',
    x: 'https://x.com', reddit: 'https://www.reddit.com',
    github: 'https://github.com', amazon: 'https://www.amazon.com',
    netflix: 'https://www.netflix.com', maps: 'https://maps.google.com',
    spotify: 'https://open.spotify.com', discord: 'https://discord.com',
    twitch: 'https://www.twitch.tv', instagram: 'https://www.instagram.com',
    facebook: 'https://www.facebook.com', chatgpt: 'https://chat.openai.com',
    claude: 'https://claude.ai',
  };
  const k = target.toLowerCase().replace(/\s+/g,'').replace(/\.(com|net|org)$/,'');
  if (map[k]) return map[k];
  if (/^https?:\/\//.test(target)) return target;
  if (/\.[a-z]{2,}$/.test(target)) return 'https://' + target;
  return 'https://www.google.com/search?q=' + encodeURIComponent(target);
}

/* ════════════════════════════════════════════════════
   AI BACKENDS
════════════════════════════════════════════════════ */
function buildSystemPrompt() {
  const nameClause = S.name ? ` You address the user as ${S.name}.` : '';
  return (
    `You are Jarvis — Just A Rather Very Intelligent System — a sharp, confident, witty personal AI assistant inspired by Tony Stark's Jarvis.${nameClause} ` +
    `Reply in 1 to 3 short spoken sentences. Plain language — no markdown, no bullets, no lists. ` +
    `Responses must sound natural read aloud. ` +
    `CRITICAL: (1) Never repeat anything you've already said — always vary phrasing. ` +
    `(2) Never mention you are an AI or language model. ` +
    `(3) Be helpful, direct, and concise.`
  );
}

async function askAI(userText) {
  setState('thinking');
  const msgs = chatHistory.slice(-12);
  try {
    let reply;
    if (S.provider === 'openrouter') {
      const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + S.key,
          'HTTP-Referer': location.origin || 'jarvis-local',
          'X-Title': 'JARVIS',
        },
        body: JSON.stringify({
          model: S.model || MODELS.openrouter[0].id,
          max_tokens: 300,
          messages: [{ role: 'system', content: buildSystemPrompt() }, ...msgs],
        }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}: ${(await res.text()).slice(0, 200)}`);
      const data = await res.json();
      reply = (data.choices?.[0]?.message?.content || '').trim() || "I'm not sure how to answer that.";
    } else if (S.provider === 'claude') {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-api-key': S.key,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: S.model || 'claude-haiku-4-5-20251001',
          max_tokens: 300,
          system: buildSystemPrompt(),
          messages: msgs,
        }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}: ${(await res.text()).slice(0, 200)}`);
      const data = await res.json();
      reply = (data.content || []).map(c => c.text || '').join('').trim() || "I'm not sure.";
    }
    chatHistory.push({ role: 'assistant', content: reply });
    await respond(reply, false);
  } catch (err) {
    showError(String(err.message || err).slice(0, 100));
    setState(wantListen ? 'listening' : 'idle');
    await speak("I'm having trouble reaching my AI. Please check the key in settings.");
  }
}

function openSettings() {

cancelBtn.addEventListener('click', () => modal.classList.remove('show'));

/* ════════════════════════════════════════════════════
   WIRING — controls, menu, text, keys
════════════════════════════════════════════════════ */
canvas.addEventListener('click', toggleMic);
micBtn.addEventListener('click', e => { e.stopPropagation(); toggleMic(); });

menuBtn.addEventListener('click', e => {
  e.stopPropagation();
  menu.classList.toggle('show');
});
document.addEventListener('click', e => {
  if (!menu.contains(e.target) && e.target !== menuBtn) menu.classList.remove('show');
});

menu.addEventListener('click', e => {
  const item = e.target.closest('.menu-item');
  if (!item) return;
  const action = item.dataset.action;
  menu.classList.remove('show');
  switch (action) {
    case 'text':     textBar.classList.toggle('show'); if (textBar.classList.contains('show')) textIn.focus(); break;
    case 'log':      logEl.classList.toggle('show'); break;
    case 'clear':    chatHistory.length = 0; recentReplies.length = 0; logEl.innerHTML = ''; speak('Conversation cleared.'); break;
    case 'stop':     stopSpeaking(); break;
    case 'settings': openSettings(); break;
  }
});

textIn.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const v = textIn.value.trim();
    if (!v) return;
    textIn.value = '';
    logEl.classList.add('show');
    logMsg(v, 'user');
    chatHistory.push({ role: 'user', content: v });
    processCommand(v);
  }
  if (e.key === 'Escape') textBar.classList.remove('show');
});

document.addEventListener('keydown', e => {
  if (modal.classList.contains('show')) return;
  if (document.activeElement === textIn) return;
  if (e.code === 'Space') { e.preventDefault(); toggleMic(); }
  if (e.code === 'Escape') { stopSpeaking(); if (wantListen) stopRec(); }
});

/* ════════════════════════════════════════════════════
   BOOT
════════════════════════════════════════════════════ */
initOrb();
animate(0);

setTimeout(() => {
  setState('idle');
}, 800);

// One-time greeting when settings exist
if (S.name || S.provider !== 'none') {
  setTimeout(() => { speak(greeting()); }, 1200);
}

})();
</script>
