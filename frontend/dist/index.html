<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <title>JARVIS</title>
    <style>
      #tap-to-start {
        display: none;
        position: fixed;
        bottom: 60px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 120, 255, 0.15);
        border: 1px solid rgba(0, 120, 255, 0.5);
        color: rgba(255, 255, 255, 0.85);
        font-family: sans-serif;
        font-size: 14px;
        letter-spacing: 3px;
        text-transform: uppercase;
        padding: 14px 32px;
        border-radius: 40px;
        cursor: pointer;
        z-index: 999;
        -webkit-tap-highlight-color: transparent;
      }
      #tap-to-start:active {
        background: rgba(0, 120, 255, 0.35);
      }
      #mobile-hint {
        display: none;
        position: fixed;
        bottom: 28px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255,255,255,0.35);
        font-family: sans-serif;
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
        pointer-events: none;
        white-space: nowrap;
      }
    </style>
    <script type="module" crossorigin src="/assets/index-BESZDRKr.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Cwe2_sbG.css">
  </head>
  <body>
    <canvas id="orb-canvas"></canvas>

    <!-- Minimal controls — top right -->
    <div id="controls">
      <button id="btn-mute" title="Mute/Unmute">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
        </svg>
      </button>
      <button id="btn-menu" title="Menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/>
        </svg>
      </button>
    </div>

    <!-- Dropdown menu -->
    <div id="menu-dropdown" style="display:none">
      <button id="btn-settings">Settings</button>
      <button id="btn-restart">Restart Server</button>
      <button id="btn-fix-self">Fix Yourself</button>
    </div>

    <div id="status-text"></div>
    <div id="jarvis-label">JARVIS</div>
    <div id="error-text"></div>

    <!-- Mobile tap-to-start button (Safari requires user gesture) -->
    <button id="tap-to-start">TAP TO START</button>
    <div id="mobile-hint">Speak after tapping</div>

    <script>
      const isTouch = 'ontouchstart' in window;
      const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);

      if (isTouch || isSafari) {
        document.getElementById('tap-to-start').style.display = 'block';
        document.getElementById('mobile-hint').style.display = 'block';

        document.getElementById('tap-to-start').addEventListener('click', function() {
          // Unlock AudioContext on Safari (requires user gesture)
          try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              const ctx = new AudioCtx();
              ctx.resume();
            }
          } catch(e) {}

          this.style.display = 'none';
          document.getElementById('mobile-hint').textContent = 'Listening...';
          // Signal main.ts to start listening
          window.dispatchEvent(new CustomEvent('jarvis-activate'));
        });
      }
    </script>
  </body>
</html>
